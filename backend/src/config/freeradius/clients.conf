# ═══════════════════════════════════════════════════════════════════════════════
# clients.conf — ITSOLUTIONS FreeRADIUS
#
# Définit les NAS (MikroTik) autorisés à envoyer des requêtes RADIUS.
# Chaque routeur créé sur la plateforme devient un client ici.
#
# ⚠️  Ce fichier est GÉNÉRÉ AUTOMATIQUEMENT par le backend ITSOLUTIONS.
#     Éditez-le manuellement uniquement en dernier recours.
#     Utilisez : POST /api/radius/nas/:id/sync pour synchroniser un NAS.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Client par défaut (pour les NAS non enregistrés) ─────────────────────────
# Rejette les requêtes de sources inconnues avec un secret par défaut.
# En prod, ce bloc peut être supprimé si tous les NAS sont enregistrés.

client dynamic_default {
    ipaddr = dynamic
    secret = testing123
    require_message_authenticator = yes

    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# ─── Exemple : NAS statique ───────────────────────────────────────────────────
# Décommentez et adaptez pour un NAS à IP fixe :
#
# client mikrotik-kavumu {
#     ipaddr = 192.168.1.100
#     secret = mon_secret_tres_long_ici
#     require_message_authenticator = yes
#     shortname = kavumu-001
#
#     limit {
#         max_connections = 16
#         lifetime = 0
#         idle_timeout = 30
#     }
# }
