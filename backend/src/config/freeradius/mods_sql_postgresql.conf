# ═══════════════════════════════════════════════════════════════════════════════
# mods-available/sql — rlm_sql pour PostgreSQL (ITSOLUTIONS)
#
# Ce module connecte FreeRADIUS à la même base PostgreSQL que le backend.
# Il lit les comptes Hotspot (RadiusUser) et écrit les sessions (RadiusSession,
# RadiusAccounting) directement.
#
# Installation :
#   cp mods_sql_postgresql.conf /etc/freeradius/3.0/mods-available/sql
#   ln -sf /etc/freeradius/3.0/mods-available/sql /etc/freeradius/3.0/mods-enabled/sql
#
# Variables d'environnement FreeRADIUS (dans /etc/freeradius/3.0/env):
#   SQL_POSTGRESQL_SERVER = l'adresse du serveur PostgreSQL
#   SQL_POSTGRESQL_PORT   = le port (défaut: 5433)
# ═══════════════════════════════════════════════════════════════════════════════

sql {
    driver = "rlm_sql_postgresql"

    # ─── Connexion ────────────────────────────────────────────────────────────
    server = "${env.SQL_POSTGRESQL_SERVER:-127.0.0.1}"
    port = ${env.SQL_POSTGRESQL_PORT:-5433}
    login = "${env.SQL_POSTGRESQL_USER:-itsolutions}"
    password = "${env.SQL_POSTGRESQL_PASSWORD:-itsolutions}"
    radius_db = "${env.SQL_POSTGRESQL_DB:-itsolutions}"

    # Pool de connexions
    pool {
        start = 5
        min = 3
        max = 20
        spare = 3
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }

    # ─── Requêtes SQL ────────────────────────────────────────────────────────
    # Le schéma ITSOLUTIONS utilise RadiusUser pour l'authentification
    # et RadiusSession / RadiusAccounting pour l'accounting.

    read_clients = no

    # ─── AUTHORIZATION (Authorize) ───────────────────────────────────────────
    # Lookup de l'utilisateur : recherche dans RadiusUser par username ET isolation par tenant (NAS).
    # Le mot de passe est stocké sous forme de hash bcrypt -> mappé sur Crypt-Password.
    # Seuls les comptes actifs, rattachés au tenant du NAS appelant et non expirés sont autorisés.

    authorize {
        revoke_reply = yes

        # Requête principale : récupérer le user par username avec isolation stricte du tenant (NAS)
        authorize_user = "SELECT \
            ru.id, \
            ru.username, \
            ru.\"passwordHash\" AS \"Crypt-Password\", \
            ru.status, \
            ru.\"expiresAt\", \
            ru.\"groupId\", \
            hg.name AS \"group_name\", \
            hp.\"durationMinutes\", \
            hp.\"maxDevices\", \
            hp.\"quotaMb\", \
            hp.\"downloadRate\", \
            hp.\"uploadRate\" \
        FROM \"RadiusUser\" ru \
        JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = ru.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
        LEFT JOIN \"HotspotGroup\" hg ON hg.id = ru.\"groupId\" \
        LEFT JOIN \"HotspotProfile\" hp ON hp.id = ru.\"profileId\" \
        WHERE ru.username = '%{SQL-User-Name}' \
        AND ru.status = 'ACTIVE' \
        AND rn.status = 'ACTIVE' \
        AND (ru.\"expiresAt\" IS NULL OR ru.\"expiresAt\" > NOW())"

        # Vérification du groupe
        authorize_group = "SELECT \
            hg.id, \
            hg.name, \
            hg.\"ownerId\" \
        FROM \"HotspotGroup\" hg \
        WHERE hg.id = '%{sql-c0}'"

        # Simultaneous-Use (appareils simultanés avec isolation tenant)
        simul_count_query = "SELECT COUNT(*) \
            FROM \"RadiusSession\" rs \
            JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = rs.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
            WHERE rs.\"userId\" = ( \
                SELECT ru.id FROM \"RadiusUser\" ru \
                JOIN \"RadiusNas\" rn2 ON rn2.\"ownerId\" = ru.\"ownerId\" AND rn2.\"nasIdentifier\" = '%{NAS-Identifier}' \
                WHERE ru.username = '%{SQL-User-Name}' LIMIT 1 \
            ) \
            AND rs.status = 'ACTIVE'"

        # Pool d'adresses IP (si utilisé)
        sql_replay = {
            simulate_calling_station_id = no
        }
    }

    # ─── AUTHENTICATION (Authenticate) ───────────────────────────────────────
    # Vérification du mot de passe bcrypt via le module PAP (Crypt-Password).

    authenticate {
    }

    # ─── ACCOUNTING ──────────────────────────────────────────────────────────
    # Écrit les données d'accounting dans RadiusSession et RadiusAccounting avec isolation tenant.

    accounting {
        # Démarrage de session
        start = "INSERT INTO \"RadiusSession\" ( \
            id, \"ownerId\", \"nasId\", \"groupId\", \"userId\", \
            username, \"sessionId\", \"ipAddress\", \"macAddress\", \
            \"startedAt\", \"downloadOctets\", \"uploadOctets\", \
            \"lastActivityAt\", status \
        ) SELECT \
            gen_random_uuid(), \
            ru.\"ownerId\", \
            rn.id, \
            ru.\"groupId\", \
            ru.id, \
            ru.username, \
            '%{Acct-Session-Id}', \
            '%{Framed-IP-Address}', \
            '%{Calling-Station-Id}', \
            NOW(), \
            0, 0, \
            NOW(), \
            'ACTIVE' \
        FROM \"RadiusUser\" ru \
        JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = ru.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
        WHERE ru.username = '%{SQL-User-Name}' \
        LIMIT 1"

        # Compteur d'appareils simultanés
        simul_count_query = "SELECT COUNT(*) \
            FROM \"RadiusSession\" rs \
            JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = rs.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
            WHERE rs.\"userId\" = ( \
                SELECT ru.id FROM \"RadiusUser\" ru \
                JOIN \"RadiusNas\" rn2 ON rn2.\"ownerId\" = ru.\"ownerId\" AND rn2.\"nasIdentifier\" = '%{NAS-Identifier}' \
                WHERE ru.username = '%{SQL-User-Name}' LIMIT 1 \
            ) \
            AND rs.status = 'ACTIVE'"

        # Fin de session
        stop = "UPDATE \"RadiusSession\" SET \
            status = 'BLOCKED', \
            \"downloadOctets\" = %{Acct-Input-Octets}, \
            \"uploadOctets\" = %{Acct-Output-Octets}, \
            \"lastActivityAt\" = NOW() \
        WHERE \"sessionId\" = '%{Acct-Session-Id}' \
        AND status = 'ACTIVE'"

        # Mise à jour intermédiaire
        update = "UPDATE \"RadiusSession\" SET \
            \"downloadOctets\" = %{Acct-Input-Octets}, \
            \"uploadOctets\" = %{Acct-Output-Octets}, \
            \"lastActivityAt\" = NOW() \
        WHERE \"sessionId\" = '%{Acct-Session-Id}' \
        AND status = 'ACTIVE'"

        # Accounting table (historique)
        accounting_start = "INSERT INTO \"RadiusAccounting\" ( \
            id, \"ownerId\", \"nasId\", \"groupId\", \"userId\", \
            username, \"sessionId\", \"ipAddress\", \"macAddress\", \
            \"startedAt\", \"downloadOctets\", \"uploadOctets\" \
        ) SELECT \
            gen_random_uuid(), \
            ru.\"ownerId\", \
            rn.id, \
            ru.\"groupId\", \
            ru.id, \
            ru.username, \
            '%{Acct-Session-Id}', \
            '%{Framed-IP-Address}', \
            '%{Calling-Station-Id}', \
            NOW(), \
            0, 0 \
        FROM \"RadiusUser\" ru \
        JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = ru.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
        WHERE ru.username = '%{SQL-User-Name}' \
        LIMIT 1"

        accounting_stop = "UPDATE \"RadiusAccounting\" SET \
            \"endedAt\" = NOW(), \
            \"durationSeconds\" = %{Acct-Session-Time}, \
            \"downloadOctets\" = %{Acct-Input-Octets}, \
            \"uploadOctets\" = %{Acct-Output-Octets}, \
            \"disconnectCause\" = '%{Acct-Terminate-Cause}', \
            \"lastActivityAt\" = NOW() \
        WHERE \"sessionId\" = '%{Acct-Session-Id}' \
        AND \"endedAt\" IS NULL"

        accounting_update = "UPDATE \"RadiusAccounting\" SET \
            \"downloadOctets\" = %{Acct-Input-Octets}, \
            \"uploadOctets\" = %{Acct-Output-Octets}, \
            \"lastActivityAt\" = NOW() \
        WHERE \"sessionId\" = '%{Acct-Session-Id}' \
        AND \"endedAt\" IS NULL"
    }

    # ─── POST-AUTH ───────────────────────────────────────────────────────────
    # Après authentification réussie, journaliser dans un fichier log
    # et appeler le webhook du backend si configuré.

    post-auth {
        # Log local
        file_log = "INSERT INTO \"AuditLog\" ( \
            id, action, \"targetType\", \"targetId\", metadata, \"createdAt\" \
        ) SELECT \
            gen_random_uuid(), \
            'RADIUS_AUTH', \
            'RadiusUser', \
            ru.id, \
            '{\"nas\": \"%{NAS-Identifier}\", \"status\": \"%{reply:Packet-Code}\", \"ip\": \"%{Framed-IP-Address}\"}', \
            NOW() \
        FROM \"RadiusUser\" ru \
        JOIN \"RadiusNas\" rn ON rn.\"ownerId\" = ru.\"ownerId\" AND rn.\"nasIdentifier\" = '%{NAS-Identifier}' \
        WHERE ru.username = '%{SQL-User-Name}' \
        LIMIT 1"
    }
}
