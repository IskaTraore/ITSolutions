services:
  db:
    image: postgres:16-alpine
    container_name: itsolutions-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsolutions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsolutions}
      POSTGRES_DB: ${POSTGRES_DB:-itsolutions}
    ports:
      # Liaison restreinte à localhost pour empêcher l'exposition publique
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - itsolutions_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsolutions}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  itsolutions_pgdata:
